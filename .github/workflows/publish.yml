name: Publish image

# Nothing about Conker is installable until this runs. The compose files pin
# image tags, and a tag that does not exist in a registry is a compose file
# that cannot come up on anyone else's machine.
#
# Tags only. `latest` is never published: a moving tag in an install a stranger
# runs is a supply chain attack that needs no attacker, and ADR-0008 requires
# every dependency to be pinned to an exact version.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Lets the registry record which workflow and commit produced the image, so a
  # published tag can be traced back to the source that built it.
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if the tag does not match the module version
        # A tag and a CHANGELOG that disagree make "which version is this?"
        # unanswerable, which the module contract exists to prevent.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## ${TAG}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${TAG}' section for tag ${GITHUB_REF_NAME}." >&2
            echo "Add the entry before tagging - a release nobody wrote down is not a release." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        # Not available for user-owned private repositories. The image is
        # already pushed by this point, so failing here would report a
        # successful publish as a failed one.
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
